<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>For You ❤️</title>

<style>
body {
  margin: 0;
  height: 100vh;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;

  /* Background image */
  background-image: url("https://i.imgur.com/your-image.jpg");
  background-size: cover;
  background-position: center;
}

/* dark overlay so text is readable */
.overlay {
  position: absolute;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.4);
}

#tap {
  position: relative;
  z-index: 2;
  font-size: 40px;
  color: white;
  cursor: pointer;
  padding: 20px 30px;
  border: 2px solid white;
  border-radius: 15px;
  transition: 0.3s;
}

#tap:hover {
  transform: scale(1.1);
}

#message {
  display: none;
  position: relative;
  z-index: 2;
  color: white;
  font-size: 20px;
  max-width: 300px;
}
</style>
</head>

<body>

<div class="overlay"></div>

<div id="tap">Tap ❤️</div>

<div id="message">
  😘💋<br><br>
  I'm sorry, baby. I’ll be more patient and better at how I handle things. I love you ❤️
</div>

<script>
document.getElementById("tap").onclick = function() {
  document.getElementById("tap").style.display = "none";
  document.querySelector(".overlay").style.background = "rgba(0,0,0,0.6)";
  document.getElementById("message").style.display = "block";
};
</script>

</body>
</html>
